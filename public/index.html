<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partial Existence API — Status</title>
  <style>
    :root {
      --bg: #09090b;
      --card: #18181b;
      --border: #27272a;
      --text: #fafafa;
      --muted: #a1a1aa;
      --accent: #22c55e;
      --accent-glow: rgba(34, 197, 94, 0.2);
    }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem;
      max-width: 520px;
      width: 90%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--accent-glow);
      color: var(--accent);
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    .dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
    }
    h1 {
      font-size: 1.5rem;
      margin: 0 0 0.5rem 0;
    }
    p {
      color: var(--muted);
      line-height: 1.6;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }
    .endpoints {
      background: #121214;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
    }
    .endpoint {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: monospace;
      font-size: 0.85rem;
      padding: 0.4rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .endpoint:last-child {
      border-bottom: none;
    }
    .method {
      color: #38bdf8;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="status-badge">
      <span class="dot"></span> Edge Functions Active
    </div>
    <h1>Partial Existence Backend</h1>
    <p>Cloudflare Pages serverless backend for comments, likes, and pageviews powered by Cloudflare D1 Edge SQL.</p>

    <div class="endpoints">
      <div class="endpoint">
        <span class="method">GET/POST</span>
        <span>/api/pageviews?slug={id}</span>
      </div>
      <div class="endpoint">
        <span class="method">GET/POST</span>
        <span>/api/likes?slug={id}</span>
      </div>
      <div class="endpoint">
        <span class="method">GET/POST</span>
        <span>/api/comments?slug={id}</span>
      </div>
      <div class="endpoint">
        <span class="method">GET</span>
        <span>/api/stats</span>
      </div>
    </div>
  </div>
</body>
</html>
